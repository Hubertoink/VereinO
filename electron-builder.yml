appId: org.verein.finanzplaner
productName: VereinO
buildVersion: 4.15.2
icon: build/icon.png
files:
  - dist/**
  - dist-electron/**
asar: true
asarUnpack:
  - '**/*.node'
  - 'node_modules/tesseract.js/**'
  - 'node_modules/tesseract.js-core/**'
extraResources:
  - from: assets/ocr
    to: ocr
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
directories:
  output: release
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/Icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/Icon.ico
  uninstallerIcon: build/Icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
  license: LICENSE
  installerLanguages:
    - de_DE
  language: 1031
  runAfterFinish: true
  deleteAppDataOnUninstall: false
artifactName: '${productName}-Setup-${version}-${arch}.${ext}'
mac:
  category: public.app-category.finance
  icon: build/icon-1024.png
  target:
    - target: dmg
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: '${productName}-${version}-${arch}.${ext}'
linux:
  target: [AppImage]
  category: Finance
  icon: build/icon.png
  artifactName: '${productName}-${version}-${arch}.${ext}'
publish:
  provider: github
  owner: Hubertoink
  repo: VereinO
  releaseType: release
  channel: latest
  vPrefixedTagName: true
