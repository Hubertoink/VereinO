name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full lint and test suite
        type: boolean
        default: false
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: ${{ inputs.full_suite == true }}
        run: npm run lint
      - run: npm run typecheck
      - if: ${{ inputs.full_suite == true }}
        run: npm run typecheck:ts7
      - run: npm run build
      - run: npm run test:essential
      - if: ${{ inputs.full_suite == true }}
        run: npm test -- --ci --reporters=default --reporters=jest-junit
      - if: ${{ inputs.full_suite == true }}
        run: npm run test:e2e -- --reporter=list
