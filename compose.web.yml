# Isolated web pilot: deliberately separate from the legacy docker-compose.yml.
name: vereino-web
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vereino
      POSTGRES_USER: vereino
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your env file}
    volumes:
      - web_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vereino -d vereino"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://vereino:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/vereino
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY_HOPS: "1"
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact browser origin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random initial setup token}
    volumes:
      - web_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  web_database:
  web_uploads:
